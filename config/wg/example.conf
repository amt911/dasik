# Example WireGuard tunnel, in wg-quick's own format — the file wg-quick reads.
#
# dasik places it verbatim at /etc/wireguard/<name>.conf, mode 0600, and never
# converts it: to serve this tunnel with NetworkManager instead, import it once
# and declare the result:
#
#     nmcli connection import type wireguard file config/wg/example.conf
#
# The keys below are placeholders. Generate real ones with:
#     wg genkey | (umask 0077 && tee peer.key) | wg pubkey > peer.pub
[Interface]
Address = 10.0.0.2/24
PrivateKey = OJj8+P0000000000000000000000000000000000000=

[Peer]
PublicKey = OJj8+P0000000000000000000000000000000000000=
Endpoint = vpn.example.com:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
