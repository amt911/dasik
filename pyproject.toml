[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasik"
version = "0.5.0"
description = "Arch Linux installation and configuration tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Andres", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "colorama",
    "pydantic"
]

[project.scripts]
dasik = "dasik.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dasik*"]
exclude = ["tests*"]

[project.optional-dependencies]
# hypothesis powers the property-based idempotency tests (CLAUDE.md § Quality:
# "highest priority") — see tests/lib/**/test_*_propert*.py and *_roundtrip.py.
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "bandit[toml]"]
# Mutation testing (CLAUDE.md § Quality: highest priority). Kept in its own
# extra so the `dev` extra / CI test job stay lean — install with
# `pip install -e .[mut]`. See docs/mutation-testing.md.
mut = ["mutmut>=3.6,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.bandit]
# dasik is a system installer: it shells out to arch-chroot/pacman/sgdisk/etc. by
# design, so these categories fire on essentially every call and are not defects
# here. Untrusted config values are validated at the boundary before they reach a
# command line (package/identifier validation), and Command.execute resolves full
# binary paths via shutil.which. Specific residual findings (B108 /tmp inside the
# install chroot, B110 deliberate fallbacks) are annotated inline with `# nosec`.
#   B404 - importing subprocess
#   B603 - subprocess call without shell=True (we NEVER use shell=True)
#   B607 - starting a process with a partial path (PATH is controlled at install)
#   B108 - /tmp path, but only inside the freshly-installed target chroot during
#          install (single-user; ms_fonts_action), never the host /tmp
#   B110 - try/except/pass: a deliberate parse fallback + a best-effort cleanup in
#          a finally block (disk_partition_action), both annotated inline
skips = ["B404", "B603", "B607", "B108", "B110"]

[tool.mypy]
# `mypy dasik` should report no errors. Keep it that way. colorama ships no type
# stubs; that is an upstream-packaging gap, not a bug in our code, so silence the
# missing-import for it rather than pulling in types-colorama as a hard dep.
[[tool.mypy.overrides]]
module = "colorama.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["dasik"]
branch = true
omit = [
    # execute() partitions disks / formats filesystems / runs sgdisk — purely
    # destructive shell-outs that must never run in a test (CLAUDE.md §Tests).
    "dasik/lib/actions/disk_partition_action.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

# --- Mutation testing (mutmut 3.x) ---------------------------------------
# The idempotency core is the highest-value mutation target (CLAUDE.md
# § Quality): a flipped `>`/`>=`, a dropped line, or a swapped set operator
# here is exactly the "covered but not verified" bug that breaks idempotency
# or wipes a disk. mutmut copies `source_paths` into ./mutants, applies one
# mutation at a time, and re-runs the selected tests; a mutant that survives
# means no test asserts on that behaviour.
#
# `source_paths` copies the whole package so imports resolve inside ./mutants;
# `only_mutate` restricts *which* files actually get mutated to the pure
# set-math core. Widen it (or use scripts/mutation.sh --reconciler) for the
# tier-2 reconciler pass. See docs/mutation-testing.md.
[tool.mutmut]
source_paths = ["dasik"]
# The two pure idempotency cores: the D/M/A/F set-math and the shared scalar
# (single-value) reconcile. A flipped comparison in either breaks the
# "re-run = no-op" contract for every domain that routes through them.
only_mutate = [
    "dasik/lib/state/set_math.py",
    "dasik/lib/actions/scalar_action.py",
    "dasik/lib/actions/composite_action.py",
]
# Per-mutant test selection: the suites that actually exercise those cores
# (set-math, reconciler, and the scalar/timezone/users idempotency tests).
# Running the whole suite per mutant would be pure overhead.
pytest_add_cli_args_test_selection = [
    "tests/lib/state/test_set_math.py",
    "tests/lib/reconciler/",
    "tests/lib/actions/",
]
