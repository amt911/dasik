name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows the VM harness (and the rest of CI) to be triggered by hand. The
  # actual loopback/QEMU runs need root / nested KVM and run locally, not here
  # (see docs/vm-testing.md); this just enables manual dispatch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      # pytest-cov enforces the 80% gate via [tool.coverage.report] fail_under
      # in pyproject.toml — no extra flags needed for the gate itself.
      - name: Run pytest with coverage
        run: pytest --cov=dasik

  type-check:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    # Advisory: mypy is a documented practice (CLAUDE.md § Commands) but is not
    # yet a pinned `dev` extra in pyproject.toml, and the codebase currently has
    # a handful of known findings (missing colorama stubs, a couple of Optional
    # narrowing issues in reconciler.py/packages_action.py). Not a merge gate
    # until those are triaged and mypy is formalized as a dev dependency.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + mypy
        run: |
          pip install -e .
          pip install mypy

      # continue-on-error at the step (not job) level so this reports green —
      # it's advisory, not a merge gate; see the note above.
      - name: Run mypy
        continue-on-error: true
        run: mypy dasik

  audit:
    name: Dependency audit — pip-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: queries the PyPI advisory DB over the network, which can be
    # flaky in CI; not a merge gate, just a signal to review.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Install pip-audit
        run: pip install pip-audit

      # continue-on-error at the step (not job) level so this reports green —
      # it's advisory, not a merge gate; see the note above.
      - name: Run pip-audit
        continue-on-error: true
        run: pip-audit

  semgrep:
    name: Semgrep SAST (p/python)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Verified locally: 0 findings against dasik/ + tests/ with this ruleset,
      # so this stays a blocking gate. If the ruleset later flags something,
      # drop --error and make it advisory rather than letting main go red.
      - name: Run semgrep
        run: semgrep scan --config p/python --error dasik tests

  mutation:
    name: Mutation testing — set_math (advisory)
    runs-on: ubuntu-latest
    # Advisory: mutation testing is the CLAUDE.md § Quality "highest priority"
    # backstop against covered-but-unverified idempotency logic, but the pytest
    # coverage gate stays the hard merge gate. Tier 1 only (set_math.py) — fast
    # and deterministic (~48 mutants, <1s). The reconciler tier is a slower,
    # on-demand local run: `scripts/mutation.sh --reconciler`. Details in
    # docs/mutation-testing.md.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev + mut extras)
        run: pip install -e ".[dev,mut]"

      # continue-on-error at the step level so a surviving mutant is surfaced in
      # the log without blocking merge — advisory, like mypy/pip-audit above.
      - name: Run mutation testing (tier 1)
        continue-on-error: true
        run: scripts/mutation.sh

  vm-harness-lint:
    name: VM harness — lint (advisory)
    runs-on: ubuntu-latest
    # The loopback/QEMU layers themselves need root + nested KVM and run on a
    # local host (docs/vm-testing.md); the driver's safety guards are unit-tested
    # in the `test` job. This job just static-checks the harness scripts so a
    # broken guard/quoting can't rot unnoticed.
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax) all harness scripts
        run: for f in scripts/*.sh scripts/vmtest/*.sh; do bash -n "$f"; done

      - name: shellcheck
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning -x scripts/vmtest/*.sh scripts/*.sh || true

      - name: python syntax — apply_disks_only.py
        run: python -m py_compile scripts/vmtest/apply_disks_only.py
