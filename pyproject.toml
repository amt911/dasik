[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasik"
version = "0.1.0"
description = "Arch Linux installation and configuration tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Andres", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "colorama",
    "pydantic"
]

[project.scripts]
dasik = "dasik.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dasik*"]
exclude = ["tests*"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["dasik"]
branch = true
omit = [
    # Legacy monolithic handler — deprecated, not wired into the v2/v3 path
    # (entry-point still imports it, but it is slated for removal; superseded
    # by actions_handler_v2 + ActionExecutor, which are covered).
    "dasik/lib/actions/actions_handler.py",
    # execute() partitions disks / formats filesystems / runs sgdisk — purely
    # destructive shell-outs that must never run in a test (CLAUDE.md §Tests).
    "dasik/lib/actions/disk_partition_action.py",
    # Legacy actions that predate the AbstractAction contract: they never
    # implement the abstract name/is_needed/execute, so they cannot even be
    # instantiated and are dead in the v2 path. Pending a v3 port (see
    # docs/superpowers/follow-ups.md) before they are testable.
    "dasik/lib/actions/base_install_action.py",
    "dasik/lib/actions/locale_action.py",
    "dasik/lib/actions/network_action.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
